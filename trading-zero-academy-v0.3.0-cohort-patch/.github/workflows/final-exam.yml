name: Trading Zero Final Exam — Cohort

on:
  workflow_dispatch:
    inputs:
      student_id:
        description: 'Student ID that already has a frozen 3x MASTER_CANDIDATE (e.g. 002)'
        required: true
        default: '001'
        type: string

permissions:
  contents: read

env:
  PYTHONPATH: .
  STUDENT_ID: ${{ inputs.student_id }}

jobs:
  exam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore shared Academy world
        uses: actions/cache/restore@v4
        with:
          path: data/processed
          key: final-world-${{ github.run_id }}
          restore-keys: |
            academy-world-

      - name: Restore selected Student
        uses: actions/cache/restore@v4
        with:
          path: students/${{ inputs.student_id }}
          key: final-student-${{ inputs.student_id }}-${{ github.run_id }}
          restore-keys: |
            academy-student-${{ inputs.student_id }}-

      - name: Verify exam is legitimately unlocked
        run: |
          test -f students/${STUDENT_ID}/models/master_candidate.zip || {
            echo "FINAL TEST LOCKED: Student ${STUDENT_ID} has no frozen 3x MASTER_CANDIDATE checkpoint."
            exit 1
          }

      - name: Consume frozen FINAL exactly for selected candidate
        run: python scripts/final_exam.py

      - uses: actions/upload-artifact@v4
        with:
          name: final-exam-student-${{ inputs.student_id }}-${{ github.run_number }}
          path: students/${{ inputs.student_id }}/reports/final_exam.json
