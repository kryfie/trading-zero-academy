name: Trading Zero Academy — Generation 2

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "FIRST RUN: start | later/manual recovery: resume"
        required: true
        default: resume
        type: choice
        options:
          - resume
          - start
      student_count:
        description: "Generation 2 students"
        required: true
        default: "8"
        type: string
      target_total_timesteps:
        description: "Hard ceiling per student"
        required: true
        default: "500000000"
        type: string
      auto_continue:
        description: "Queue next cohort round automatically"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: trading-zero-generation2
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  prepare-world:
    runs-on: ubuntu-latest
    outputs:
      students: ${{ steps.matrix.outputs.students }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Verify Generation 2 layout
        run: |
          test -f academy/gen2_env.py
          test -f academy/splits.py
          test -f scripts/prepare_frozen_world.py
          test -f scripts/cohort_train.py
          test -f data/manifests/generation1_partition_reference.json
          echo "Generation 2 layout OK"

      - name: Unit tests
        if: ${{ inputs.run_mode == 'start' }}
        run: pytest -q

      - name: Build student matrix
        id: matrix
        env:
          STUDENT_COUNT: ${{ inputs.student_count }}
        run: |
          python - <<'PY'
          import json, os
          n = int(os.environ["STUDENT_COUNT"])
          if n != 8:
              raise SystemExit("Generation 2 protocol is frozen at exactly 8 students.")
          students = [f"{i:03d}" for i in range(1, n + 1)]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("students=" + json.dumps(students) + "\n")
          print("Students:", students)
          PY

      - name: Restore immutable Generation 2 world
        uses: actions/cache/restore@v4
        with:
          path: data/mtf
          key: academy-gen2-frozen-world-${{ github.run_id }}
          restore-keys: |
            academy-gen2-frozen-world-
            academy-mtf-world-

      - name: Prepare and hard-verify frozen Gen1 market world
        run: python scripts/prepare_frozen_world.py

      - name: Save immutable Generation 2 world
        uses: actions/cache/save@v4
        with:
          path: data/mtf
          key: academy-gen2-frozen-world-${{ github.run_id }}

      - name: Upload identical world for all students
        uses: actions/upload-artifact@v4
        with:
          name: academy-gen2-world-${{ github.run_id }}
          path: data/mtf
          retention-days: 2

  train-students:
    needs: prepare-world
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        student: ${{ fromJSON(needs.prepare-world.outputs.students) }}

    env:
      STUDENT_ID: ${{ matrix.student }}
      GEN2_RUN_MODE: ${{ inputs.run_mode }}
      COHORT_TARGET_TIMESTEPS: ${{ inputs.target_total_timesteps }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Download identical frozen world
        uses: actions/download-artifact@v4
        with:
          name: academy-gen2-world-${{ github.run_id }}
          path: data/mtf

      - name: Restore independent Gen2 Student ${{ matrix.student }}
        uses: actions/cache/restore@v4
        with:
          path: students/${{ matrix.student }}
          key: academy-gen2-student-${{ matrix.student }}-${{ github.run_id }}
          restore-keys: |
            academy-gen2-student-${{ matrix.student }}-

      - name: Train Gen2 Student ${{ matrix.student }}
        run: python scripts/cohort_train.py

      - name: Policy Autopsy
        run: python scripts/policy_autopsy.py

      - name: Build Student summary
        run: python scripts/student_summary.py

      - name: Save independent Gen2 Student ${{ matrix.student }}
        if: always()
        uses: actions/cache/save@v4
        with:
          path: students/${{ matrix.student }}
          key: academy-gen2-student-${{ matrix.student }}-${{ github.run_id }}

      - name: Upload Gen2 Student ${{ matrix.student }} report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen2-student-${{ matrix.student }}-${{ github.run_number }}
          path: |
            students/${{ matrix.student }}/reports
            students/${{ matrix.student }}/models/best_validation.json
            students/${{ matrix.student }}/models/master_candidate.json
          if-no-files-found: warn
          retention-days: 90

  leaderboard:
    needs: [prepare-world, train-students]
    if: always() && needs.prepare-world.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: gen2-student-*-${{ github.run_number }}
          path: cohort-artifacts
          merge-multiple: false

      - name: Build Generation 2 leaderboard
        run: python scripts/build_leaderboard.py

      - name: Upload Generation 2 cohort report
        uses: actions/upload-artifact@v4
        with:
          name: academy-generation2-cohort-${{ github.run_number }}
          path: |
            reports/cohort
            cohort-artifacts
          retention-days: 90

      - name: Decide whether Generation 2 continues
        id: decision
        env:
          COHORT_TARGET_TIMESTEPS: ${{ inputs.target_total_timesteps }}
          COHORT_STUDENT_COUNT: ${{ inputs.student_count }}
          COHORT_AUTO_CONTINUE: ${{ inputs.auto_continue }}
        run: python scripts/cohort_decision.py

      - name: Queue next Generation 2 round
        if: ${{ steps.decision.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.target_total_timesteps }}
          STUDENT_COUNT: ${{ inputs.student_count }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/generation2.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"run_mode\":\"resume\",\"student_count\":\"${STUDENT_COUNT}\",\"target_total_timesteps\":\"${TARGET}\",\"auto_continue\":\"true\"}}"

      - name: Generation 2 stop reason
        if: ${{ steps.decision.outputs.continue != 'true' }}
        run: |
          echo "Generation 2 chain stopped."
          echo "500M is a hard ceiling. Do not extend."
          echo "FINAL EXAM remains manual and locked unless a MASTER_CANDIDATE exists."
