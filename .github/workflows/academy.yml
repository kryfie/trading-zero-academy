name: Trading Zero Academy — Marathon

on:
  workflow_dispatch:
    inputs:
      target_total_timesteps:
        description: 'Stop at this TOTAL Student #1 timestep count'
        required: true
        default: '123000000'
        type: string
      continuation:
        description: 'Internal flag used by the automatic marathon chain'
        required: true
        default: false
        type: boolean

concurrency:
  group: trading-zero-student-1
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: .
  ACADEMY_TARGET_TIMESTEPS: ${{ inputs.target_total_timesteps }}

jobs:
  marathon-leg:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Unit tests on first marathon leg
        if: ${{ !inputs.continuation }}
        run: pytest -q

      # New Marathon caches use this exact path set. Keeping the path set stable
      # is important because GitHub cache "version" depends on the cached paths.
      - name: Restore Marathon Student #1 memory
        id: restore_marathon
        uses: actions/cache/restore@v4
        with:
          path: |
            models
            data/processed
            reports/learning_history.csv
          key: academy-marathon-${{ github.run_id }}
          restore-keys: |
            academy-marathon-

      # v0.2.2 used only models + data/processed. A cache created with those
      # paths has a different GitHub cache version, so it must be restored in a
      # separate action using the original path set.
      - name: Restore legacy v0.2.2 Student #1 if needed
        if: ${{ hashFiles('models/latest.zip') == '' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            models
            data/processed
          key: academy-legacy-bootstrap-${{ github.run_id }}
          restore-keys: |
            academy-

      # Safety rule: never silently create a fresh Student during a marathon.
      # The user already has Student #1; if continuity is lost, fail instead.
      - name: Verify Student #1 continuity
        run: |
          python - <<'PY'
          from pathlib import Path
          from stable_baselines3 import PPO

          checkpoint = Path("models/latest.zip")
          if not checkpoint.exists():
              raise SystemExit(
                  "STOP: Student #1 checkpoint was not restored. "
                  "Marathon refuses to start a new Student from zero."
              )

          model = PPO.load(checkpoint)
          steps = int(model.num_timesteps)
          if steps <= 0:
              raise SystemExit(
                  "STOP: restored checkpoint has zero timesteps. "
                  "Marathon refuses to replace Student #1."
              )

          print(f"CONTINUITY OK — Student #1 restored at {steps:,} total timesteps")
          PY

      - name: Refresh OKX world data incrementally
        run: python scripts/download_data.py

      - name: Marathon training — checkpoint 500k / validation 2M
        run: python scripts/marathon_train.py

      - name: Show status
        run: python scripts/status.py

      - name: Save Student #1 + Marathon memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            models
            data/processed
            reports/learning_history.csv
          key: academy-marathon-${{ github.run_id }}

      - name: Upload progress artifact — includes best Student ever
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-marathon-${{ github.run_number }}
          path: |
            reports/status.json
            reports/progress.json
            reports/learning_history.csv
            models/best_validation.zip
            models/best_validation.json
            models/latest.zip
            data/processed/split_manifest.json
            data/processed/training_state.json
          if-no-files-found: warn
          retention-days: 90

      - name: Decide whether marathon continues
        id: decision
        if: success()
        run: python scripts/marathon_decision.py

      - name: Queue next marathon leg automatically
        if: ${{ success() && steps.decision.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.decision.outputs.target }}
        run: |
          echo "Queueing next leg from ${{ steps.decision.outputs.current }} toward ${TARGET} total steps..."
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/academy.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"target_total_timesteps\":\"${TARGET}\",\"continuation\":\"true\"}}"

      - name: Marathon stop reason
        if: ${{ success() && steps.decision.outputs.continue != 'true' }}
        run: |
          echo "Marathon chain stopped."
          echo "Current steps: ${{ steps.decision.outputs.current }}"
          echo "Target steps:  ${{ steps.decision.outputs.target }}"
          echo "Graduation ready: ${{ steps.decision.outputs.graduation_ready }}"
          echo "FINAL TEST remains LOCKED and must be started manually."
