project:
  name: Trading Zero Academy
  seed: 42
market:
  exchange: OKX
  instrument_type: SWAP
  bar: 5m
  symbols:
  - BTC-USDT-SWAP
  - ETH-USDT-SWAP
  - SOL-USDT-SWAP
  - XRP-USDT-SWAP
  - SUI-USDT-SWAP
  candle_limit_per_request: 100
  history_days: 180
world_rules:
  starting_equity: 100.0
  max_leverage: 10.0
  taker_fee_rate: 0.0008
  base_slippage_bps: 1.0
  volatility_slippage_multiplier: 0.15
  liquidation_buffer: 0.003
  min_equity: 1.0
  max_episode_bars: 2016
  observation_window: 96
  max_position_fraction: 1.0
learner:
  algorithm: PPO
  timesteps_per_block: 500000
  blocks_per_run: 4
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 256
  gamma: 0.995
  gae_lambda: 0.95
  ent_coef: 0.01
  clip_range: 0.2
  policy_layers:
  - 256
  - 256
  marathon_target_total_timesteps: 123000000
  marathon_steps_per_run: 10000000
  marathon_validation_interval_blocks: 4
  marathon_master_candidate_streak: 3
  marathon_stop_on_master_streak: true
evaluation:
  train_fraction: 0.7
  validation_fraction: 0.15
  final_test_fraction: 0.15
  live_shadow_days: 7
  train_maturation_days: 30
  min_rolling_validation_bars: 2016
  validation_episodes: 30
  live_shadow_episodes: 10
  candidate_min_episodes: 20
  candidate_min_median_return_pct: 2.0
  candidate_max_median_drawdown_pct: 20.0
  candidate_min_profitable_episode_ratio: 0.55
  candidate_min_profit_factor: 1.05
  final_test_unlock_file: reports/FINAL_TEST_UNLOCK
runtime:
  checkpoint_path: models/latest.zip
  training_state_path: models/training_state.json
  vecnorm_path: models/vecnormalize.pkl
  status_path: reports/status.json
  progress_path: reports/progress.json
  learning_history_path: reports/learning_history.csv
  best_checkpoint_path: models/best_validation.zip
  best_metrics_path: models/best_validation.json
