project:
  name: Trading Zero Academy — Generation 3
  generation: 3
  experiment_id: GEN3_SEQUENCE_MEMORY_V1
  seed: 42

market:
  exchange: OKX
  instrument_type: SWAP
  decision_bar: 5m
  multi_timeframes:
    - 1m
    - 5m
    - 15m
    - 1H
    - 4H
  multi_timeframe_windows:
    1m: 60
    5m: 96
    15m: 64
    1H: 48
    4H: 24
  symbols:
    - BTC-USDT-SWAP
    - ETH-USDT-SWAP
    - SOL-USDT-SWAP
    - XRP-USDT-SWAP
    - SUI-USDT-SWAP
  candle_limit_per_request: 300
  frozen_partition_reference: data/manifests/generation1_partition_reference.json

world_rules:
  starting_equity: 100.0
  max_leverage: 10
  taker_fee_rate: 0.0008
  base_slippage_bps: 1.0
  volatility_slippage_multiplier: 0.15
  min_equity: 1.0
  max_episode_bars: 2016
  max_position_fraction: 1.0

action_space:
  type: DISCRETE_TARGET_POSITION
  min_target_leverage: -10
  max_target_leverage: 10
  step: 1

learner:
  algorithm: RecurrentPPO
  policy: MlpLstmPolicy
  timesteps_per_block: 500000
  validation_interval_blocks: 4
  steps_per_round: 2000000
  target_total_timesteps: 1000000000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.95
  ent_coef: 0.01
  vf_coef: 0.5
  clip_range: 0.2
  max_grad_norm: 0.5
  policy_layers:
    - 256
    - 256
  lstm_hidden_size: 256
  n_lstm_layers: 1
  shared_lstm: false
  enable_critic_lstm: true
  master_candidate_streak: 3

checkpointing:
  top_validation_checkpoints: 5

evaluation:
  validation_episodes: 30
  candidate_min_episodes: 20
  candidate_min_median_return_pct: 2.0
  candidate_max_median_drawdown_pct: 20.0
  candidate_min_profitable_episode_ratio: 0.55
  candidate_min_profit_factor: 1.05
  autopsy_episodes: 10
